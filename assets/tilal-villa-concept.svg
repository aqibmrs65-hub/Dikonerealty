<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual luxury standalone villa</title>
  <desc id="desc">An original architectural illustration of a contemporary three-level villa with garden and water features.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08131d"/>
      <stop offset="0.58" stop-color="#17313d"/>
      <stop offset="1" stop-color="#927957"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bdd1d3" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#496b72" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#142a34" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7ddcb"/>
      <stop offset="1" stop-color="#bba98c"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d9fa6"/>
      <stop offset="1" stop-color="#173e4a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f8dfaa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f8dfaa" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="40" stdDeviation="35" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1600" height="1120" fill="url(#sky)"/>
  <circle cx="1120" cy="310" r="270" fill="url(#sun)" filter="url(#blur)"/>
